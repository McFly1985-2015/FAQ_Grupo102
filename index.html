<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preguntas frecuentes | Grupo 102</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#657089;--primary:#b51f2e;--primary2:#861621;--line:#dfe5ef;--bot:#eef2f8;--user:#b51f2e;--shadow:0 18px 50px rgba(25,40,75,.13)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(145deg,#f7f9fd,#edf2f8);color:var(--text);min-height:100vh}.page{width:min(100%,820px);margin:auto;padding:24px 14px}.hero{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;padding:26px;border-radius:22px 22px 0 0}.hero h1{font-size:clamp(1.5rem,5vw,2.25rem);margin:0 0 6px}.hero p{margin:0;opacity:.9}.panel{background:var(--card);box-shadow:var(--shadow);border-radius:0 0 22px 22px;overflow:hidden}.quick{display:flex;gap:8px;overflow-x:auto;padding:14px;border-bottom:1px solid var(--line);scrollbar-width:thin}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 12px;border-radius:999px;cursor:pointer;font-weight:600}.chip:hover,.chip:focus{border-color:var(--primary);color:var(--primary);outline:none}.chat{height:480px;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.msg{max-width:84%;padding:12px 14px;border-radius:16px;line-height:1.45;white-space:pre-line}.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}.user{align-self:flex-end;background:var(--user);color:#fff;border-bottom-right-radius:4px}.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:#fff}.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px}.composer input:focus{outline:3px solid rgba(181,31,46,.15);border-color:var(--primary)}.composer button{border:0;background:var(--primary);color:#fff;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer}.composer button:hover{background:var(--primary2)}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:12px}.contact{color:var(--primary);font-weight:700}.warn{font-size:.78rem;color:var(--muted);margin-top:8px}@media(max-width:520px){.page{padding:0}.hero,.panel{border-radius:0}.chat{height:58vh}.msg{max-width:92%}}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <h1>Asistente para padres</h1>
    <p>Grupo 102 · Ciclo escolar 2026–2027</p>
  </header>
  <section class="panel" aria-label="Chat de preguntas frecuentes">
    <div class="quick" aria-label="Preguntas rápidas">
      <button class="chip" type="button" data-q="¿Cuántos alumnos hay?">Alumnos</button>
      <button class="chip" type="button" data-q="¿Dónde envío un justificante?">Justificantes</button>
      <button class="chip" type="button" data-q="¿Qué hago si mi hijo falta?">Faltas</button>
      <button class="chip" type="button" data-q="¿Cuál es el uniforme de gala?">Uniforme</button>
      <button class="chip" type="button" data-q="¿Qué sabemos de graduación?">Graduación</button>
      <button class="chip" type="button" data-q="¿Cuál es la actividad de convivencia deportiva del grupo 102?">Convivencia</button>
      <button class="chip" type="button" data-q="¿Dónde se publican las guías?">Guías</button>
      <button class="chip" type="button" data-q="¿Qué hacer si se pierde una chamarra?">Objetos perdidos</button>
      <button class="chip" type="button" data-q="¿Cuáles son los recordatorios importantes?">Recordatorios</button>
    </div>
    <div id="chat" class="chat" aria-live="polite"></div>
    <form id="chatForm" class="composer" novalidate>
      <input id="question" type="text" autocomplete="off" enterkeyhint="send" placeholder="Escribe tu pregunta…" aria-label="Escribe tu pregunta">
      <button id="sendButton" type="submit" aria-label="Enviar pregunta">Enviar</button>
    </form>
    <div class="footer">La información puede cambiar. Confirma fechas y avisos recientes con el colegio.</div>
  </section>
</main>
<script>
(function () {
  'use strict';

  function initChatbot() {
    const chat = document.getElementById('chat');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('question');
    const sendButton = document.getElementById('sendButton');
    if (!chat || !form || !input || !sendButton) return;

    const faq = [
      {
            "k": [
                  "convivencia",
                  "convivencia deportiva",
                  "actividad convivencia",
                  "color rojo",
                  "snacks",
                  "puesto compartido"
            ],
            "a": "Para la convivencia deportiva: grupo 102, color rojo, puesto compartido con el grupo 101 y actividad asignada de snacks."
      },
      {
            "k": [
                  "cuantos alumnos",
                  "cantidad alumnos",
                  "numero alumnos",
                  "21 alumnos",
                  "ninos en el grupo"
            ],
            "a": "El grupo 102 está integrado por 21 alumnos."
      },
      {
            "k": [
                  "justificante",
                  "justificacion",
                  "inasistencia",
                  "comprobante medico",
                  "receta medica",
                  "donde envio justificante"
            ],
            "a": "Envía el justificante a cbc.prefecturanm@calmecac.edu.mx. Incluye nombre completo del alumno, grupo 102, fecha de la ausencia, motivo y receta o constancia cuando corresponda.\n\nAsunto sugerido: Justificante de inasistencia – Nombre del alumno – Grupo 102."
      },
      {
            "k": [
                  "hijo falta",
                  "hijo falto",
                  "va a faltar",
                  "falto a clases",
                  "tarea por ausencia",
                  "que hago si mi hijo falta"
            ],
            "a": "Revisa el grupo para tareas o avisos. Si la ausencia es por enfermedad y requiere justificación, envía la receta o comprobante al colegio según las indicaciones vigentes."
      },
      {
            "k": [
                  "hijo enfermo",
                  "esta enfermo",
                  "enfermedad",
                  "influenza",
                  "contagio",
                  "que pasa si mi hijo esta enfermo"
            ],
            "a": "Se recomienda no enviarlo a clases para evitar contagios. En diversos momentos del ciclo se han aplicado protocolos por influenza y enfermedades respiratorias; revisa los avisos vigentes del colegio."
      },
      {
            "k": [
                  "estancia",
                  "guarderia",
                  "suspension especial",
                  "habra estancia",
                  "habra guarderia"
            ],
            "a": "No siempre habrá estancia o guardería cuando exista una suspensión especial. Se debe confirmar cada evento, ya que ha habido ocasiones en las que se informó que no habría estancia."
      },
      {
            "k": [
                  "cuando se usa uniforme de gala",
                  "uniforme de gala",
                  "uniforme gala",
                  "eventos gala"
            ],
            "a": "El uniforme de gala se utiliza en eventos especiales, como fotografías de graduación, ceremonias oficiales y actividades que indique la escuela."
      },
      {
            "k": [
                  "que incluye el uniforme de gala",
                  "incluye uniforme gala",
                  "camisa corbata",
                  "pantalon falda zapatos"
            ],
            "a": "El uniforme de gala incluye camisa oficial, corbata, pantalón o falda correspondiente, zapatos limpios y una presentación cuidada."
      },
      {
            "k": [
                  "vestimenta tematica",
                  "ropa tematica",
                  "san valentin",
                  "ano nuevo chino",
                  "patrick"
            ],
            "a": "Generalmente se permite ropa relacionada con el evento, por ejemplo San Valentín, Año Nuevo Chino o St. Patrick’s Day. La escuela informa las condiciones con anticipación."
      },
      {
            "k": [
                  "cuando es la toma de fotografias de graduacion",
                  "fecha fotos graduacion",
                  "fotografias de graduacion",
                  "foto grupal"
            ],
            "a": "La escuela informa una fecha específica. Es importante asistir porque normalmente no hay reposición para la fotografía grupal. Confirma la fecha en el aviso vigente."
      },
      {
            "k": [
                  "que deben llevar los ninos ese dia",
                  "que llevar fotos graduacion",
                  "uniforme fotos graduacion",
                  "cabello peinado"
            ],
            "a": "Para las fotografías de graduación deben llevar uniforme de gala completo, cabello peinado, zapatos limpios y la corbata correctamente colocada."
      },
      {
            "k": [
                  "ya se termino de pagar graduacion",
                  "pago graduacion",
                  "pagos graduacion",
                  "termine de pagar graduacion"
            ],
            "a": "Los pagos de graduación se realizan por etapas. Conserva todos los comprobantes y solicita confirmación de recepción para verificar tu saldo."
      },
      {
            "k": [
                  "como se hacen las cooperaciones",
                  "cooperaciones grupo",
                  "transferencia cooperacion",
                  "mama coordina"
            ],
            "a": "Las cooperaciones del grupo normalmente se realizan mediante transferencia a la mamá que coordina cada actividad."
      },
      {
            "k": [
                  "que poner en transferencia",
                  "concepto transferencia",
                  "nombre del nino transferencia",
                  "datos del pago"
            ],
            "a": "En la transferencia escribe el nombre del niño y el concepto del pago, por ejemplo pizza, camiseta, cumpleaños u otra actividad."
      },
      {
            "k": [
                  "debo enviar comprobante",
                  "enviar comprobante",
                  "mandar comprobante",
                  "comprobante transferencia"
            ],
            "a": "Sí. Enviar el comprobante facilita el control y evita confusiones."
      },
      {
            "k": [
                  "pago no registrado",
                  "no aparece pago",
                  "no me aparece un pago registrado",
                  "falta mi pago"
            ],
            "a": "Comparte el comprobante lo antes posible con la persona responsable del registro para que pueda verificarlo."
      },
      {
            "k": [
                  "es obligatorio participar",
                  "participacion obligatoria",
                  "cooperacion voluntaria",
                  "evento obligatorio"
            ],
            "a": "No. La participación y las cooperaciones de las convivencias suelen ser voluntarias."
      },
      {
            "k": [
                  "hijo no participa",
                  "no participa convivencia",
                  "no participar evento",
                  "llevar lonche"
            ],
            "a": "Si tu hijo no participa, puede llevar su lonche habitual."
      },
      {
            "k": [
                  "como se organizan los alimentos",
                  "organizacion alimentos",
                  "encuesta comida",
                  "lista participantes"
            ],
            "a": "Generalmente se realiza una encuesta, se prepara una lista de participantes, se define la cooperación por alumno y una o varias mamás coordinan las compras y entregas."
      },
      {
            "k": [
                  "olvide enviar regalo",
                  "regalo de cumpleanos tarde",
                  "regalo posteriormente",
                  "regalo cumpleanos"
            ],
            "a": "El regalo puede enviarse posteriormente. Ha sido una práctica común dentro del grupo."
      },
      {
            "k": [
                  "quien coordina los festejos",
                  "festejo en salon",
                  "coordinar cumpleanos",
                  "maestra titular cumpleanos"
            ],
            "a": "Normalmente se contacta a la maestra titular para coordinar la fecha, el horario y la logística del festejo dentro del salón."
      },
      {
            "k": [
                  "que se acostumbra regalar",
                  "que regalar cumpleanos",
                  "regalos cumpleanos",
                  "pequenos detalles"
            ],
            "a": "No existe una obligación. Los niños suelen llevar pequeños detalles según las posibilidades de cada familia."
      },
      {
            "k": [
                  "avisar antes del cumpleanos",
                  "debo avisar cumpleanos",
                  "aviso cumpleanos hijo"
            ],
            "a": "Sí. Avisar con anticipación ayuda a que las familias se organicen."
      },
      {
            "k": [
                  "donde se publican las guias",
                  "guias de estudio",
                  "plataforma escolar",
                  "folder guias"
            ],
            "a": "Las guías se publican en la plataforma escolar y ocasionalmente también se envían impresas en el folder."
      },
      {
            "k": [
                  "no veo una guia",
                  "guia no aparece",
                  "falta guia",
                  "buscar guia"
            ],
            "a": "Primero revisa la plataforma y el folder. Si no aparece, pregunta en el grupo porque suele ser una duda recurrente."
      },
      {
            "k": [
                  "perdio una tarea",
                  "perdio un libro",
                  "libro perdido",
                  "tarea perdida",
                  "otros salones lockers"
            ],
            "a": "Avisa a la maestra y pregunta en el grupo, ya que frecuentemente las tareas o libros aparecen en otros salones o lockers."
      },
      {
            "k": [
                  "se pierde chamarra",
                  "termo perdido",
                  "sudadera perdida",
                  "objetos perdidos",
                  "pertenencia perdida"
            ],
            "a": "Revisa el área de objetos perdidos, pregunta en el grupo y verifica que la pertenencia tenga el nombre marcado."
      },
      {
            "k": [
                  "como evitar perdidas",
                  "marcar pertenencias",
                  "marcar uniforme",
                  "nombre en las cosas"
            ],
            "a": "Marca con nombre todas las pertenencias: chamarra, sudadera, termo, lonchera y folder."
      },
      {
            "k": [
                  "recordatorios importantes",
                  "que debo recordar",
                  "lista recordatorios",
                  "recomendaciones generales"
            ],
            "a": "Recordatorios importantes:\n✓ Revisar el folder diariamente.\n✓ Revisar la plataforma al menos una vez por semana.\n✓ Guardar todos los comprobantes de pago.\n✓ Marcar uniformes y pertenencias con nombre.\n✓ Informar ausencias por enfermedad.\n✓ Confirmar participación en eventos antes de las fechas límite.\n✓ Leer completamente los comunicados antes de preguntar en el grupo."
      },
      {
            "k": [
                  "correo",
                  "contacto",
                  "prefectura"
            ],
            "a": "Para justificantes de faltas, el correo actualizado es cbc.prefecturanm@calmecac.edu.mx."
      },
      {
            "k": [
                  "hola",
                  "buenos dias",
                  "buenas tardes"
            ],
            "a": "¡Hola! Puedes preguntarme sobre faltas, enfermedad, estancia, uniformes, graduación, pagos, convivencias, cumpleaños, tareas, guías u objetos perdidos."
      }
];

    function normalizeText(text) {
      return String(text || '').toLowerCase().normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function addMessage(text, type) {
      const message = document.createElement('div');
      message.className = 'msg ' + type;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    function getAnswer(question) {
      const q = normalizeText(question);
      let bestAnswer = null;
      let bestScore = 0;
      faq.forEach(function (item) {
        let score = 0;
        item.k.forEach(function (key) {
          const nk = normalizeText(key);
          if (q.includes(nk)) score += nk.split(' ').length * 3;
          else nk.split(' ').forEach(function (word) {
            if (word.length > 3 && q.includes(word)) score += 1;
          });
        });
        if (score > bestScore) {
          bestScore = score;
          bestAnswer = item.a;
        }
      });
      return bestScore >= 1 && bestAnswer ? bestAnswer :
        'No encontré una respuesta suficientemente precisa. Intenta usar palabras como “justificante”, “uniforme”, “graduación”, “convivencia” o “pagos”. Para fechas y casos específicos, confirma el aviso más reciente del colegio.';
    }

    function sendQuestion(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const question = input.value.trim();
      if (!question) {
        input.focus();
        return false;
      }
      addMessage(question, 'user');
      input.value = '';
      addMessage(getAnswer(question), 'bot');
      input.focus();
      return false;
    }

    sendButton.addEventListener('click', sendQuestion);
    form.addEventListener('submit', sendQuestion);
    input.addEventListener('keydown', function (event) {
      if ((event.key === 'Enter' || event.keyCode === 13) && !event.shiftKey && !event.isComposing) {
        sendQuestion(event);
      }
    });
    input.addEventListener('keypress', function (event) {
      if ((event.key === 'Enter' || event.keyCode === 13) && !event.shiftKey) event.preventDefault();
    });

    document.querySelectorAll('.chip').forEach(function (button) {
      button.addEventListener('click', function (event) {
        event.preventDefault();
        input.value = button.getAttribute('data-q') || '';
        sendQuestion(event);
      });
    });

    addMessage('¡Hola! Soy el asistente de preguntas frecuentes del grupo 102. ¿En qué puedo ayudarte?', 'bot');
    input.focus();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initChatbot);
  else initChatbot();
})();
</script>
</body>
</html>
